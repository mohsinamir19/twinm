requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.46",
    "dot>=0.3.0",
    "dotenv>=0.9.9",
    "env>=0.1.0",
    "fastapi>=0.128.5",
    "httpx>=0.28.0",
    "mangum>=0.21.0",
